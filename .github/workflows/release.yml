name: Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'denoisers/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'denoisers/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: '3.12'
      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          expected="v$(uv version --short)"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Expected tag $expected, got $GITHUB_REF_NAME"
            exit 1
          fi
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv build
      - name: Test the wheel
        run: |
          uv pip install --python .venv/bin/python --no-deps dist/*.whl
          uv run --no-sync pytest -q tests
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
