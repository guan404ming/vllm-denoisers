[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-denoisers"
version = "0.1.0"
description = "vLLM plugin for diffusion language models"
requires-python = ">=3.12"
dependencies = ["torch", "transformers"]

[project.optional-dependencies]
vllm = ["vllm"]

[project.entry-points."vllm.general_plugins"]
denoisers = "denoisers.plugin:register"

[dependency-groups]
dev = ["pillow", "pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["denoisers*"]

[tool.setuptools.package-data]
"denoisers.patches" = ["*.patch"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
