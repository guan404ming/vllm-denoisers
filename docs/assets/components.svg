    .detail { font-size: 15px; opacity: .74; }
    .frame { fill: none; stroke: currentColor; stroke-opacity: .32; }
    .divider { fill: none; stroke: currentColor; stroke-opacity: .20; }
    .icon { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  </style>

