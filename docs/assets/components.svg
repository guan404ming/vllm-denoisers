<svg xmlns="http://www.w3.org/2000/svg" width="800" height="352" viewBox="0 0 800 352" role="img" aria-labelledby="title desc">
  <title id="title">vllm-denoisers components</title>
  <desc id="desc">The scheduler selects requests for the model adapters. Token-canvas models use decode policies and optional KV reuse policies. Denoising advances each block and reports emitted tokens. vLLM provides batch execution and KV cache allocation.</desc>
