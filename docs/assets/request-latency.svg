<svg xmlns="http://www.w3.org/2000/svg" width="640" height="198" viewBox="0 0 640 198" role="img" aria-labelledby="title desc">
  <title id="title">One streamed request</title>
  <desc id="desc">Time to first token ends at the first streamed token. End-to-end latency covers the entire request through completion.</desc>
  <style>
    :root { color-scheme: light dark; color: CanvasText; }
    text { fill: currentColor; font-family: Inter, system-ui, sans-serif; }
    .label { font-size: 18px; font-weight: 500; }
    .detail { font-size: 15px; }
    .line { fill: none; stroke: currentColor; stroke-opacity: .32; }
    .icon { fill: none; stroke: #1976bd; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) { .icon { stroke: #53b2ff; } }
  </style>
  <rect class="line" x=".5" y="6" width="639" height="186" rx="12"/>
  <path class="icon" transform="translate(22 23)" d="M10 2a8 8 0 1 0 .01 0M10 5v6l4 2"/>
  <text class="label" x="55" y="39">One streamed request</text>
  <text class="detail" x="24" y="79">Request sent</text>
  <text class="detail" x="258" y="79" text-anchor="middle">First token</text>
  <text class="detail" x="565" y="79" text-anchor="middle">Complete</text>
  <path class="line" d="M32 96H565 M32 90v12 M258 90v12 M565 90v12"/>
  <path class="icon" d="M32 112v6h226v-6"/>
  <text class="detail" x="145" y="141" text-anchor="middle">Time to first token</text>
  <path class="line" d="M32 147v6h533v-6"/>
  <text class="detail" x="298" y="176" text-anchor="middle">End-to-end latency</text>
</svg>
