<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="672" viewBox="0 0 880 672" role="img" aria-labelledby="title desc">
  <title id="title">How vLLM schedules a denoising step</title>
  <desc id="desc">vLLM schedules a step for a model adapter. Token-canvas models update token predictions. Continuous-latent models refine a latent representation and decode it into tokens. Both use the shared canvas sampler. An unfinished block keeps its sequence position for another step. A finished block returns tokens to vLLM.</desc>
  <style>
    :root { color-scheme: light; color: CanvasText; }
    text { font-family: Inter, system-ui, sans-serif; fill: currentColor; }
    .panel { fill: none; stroke: #d5d5d5; stroke-width: 1.5; }
    .shared { fill: none; stroke: #858585; stroke-width: 2; }
    .heading { font-size: 21px; font-weight: 700; }
    .detail { font-size: 18px; }
    .wire { fill: none; stroke: #858585; stroke-width: 2; stroke-linejoin: round; }
    .arrow { fill: #858585; }
    .icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="arrow" d="M0 0 10 5 0 10Z"/>
    </marker>
  </defs>

  <g class="wire">
    <path d="M456 134V162 M252 162H660"/>
    <path d="M252 162V185" marker-end="url(#arrow)"/>
    <path d="M660 162V185" marker-end="url(#arrow)"/>
    <path d="M252 324V354H660V324"/>
    <path d="M456 354V377" marker-end="url(#arrow)"/>
    <path d="M456 482V510 M252 510H660"/>
    <path d="M252 510V533" marker-end="url(#arrow)"/>
    <path d="M660 510V533" marker-end="url(#arrow)"/>
    <path d="M68 591H34V86H63" marker-end="url(#arrow)"/>
  </g>

  <g class="panel">
    <rect x="68" y="36" width="776" height="98" rx="16"/>
    <rect x="68" y="190" width="368" height="134" rx="16"/>
    <rect x="476" y="190" width="368" height="134" rx="16"/>
    <rect x="68" y="538" width="368" height="100" rx="16"/>
    <rect x="476" y="538" width="368" height="100" rx="16"/>
  </g>
  <rect class="shared" x="68" y="382" width="776" height="100" rx="16"/>

  <image x="100" y="53" width="32" height="32" aria-hidden="true" xlink:href="data:image/png;base64,"/>
  <text class="heading" x="141" y="77">vLLM scheduler</text>
  <text class="detail" x="100" y="107">Select requests for next step</text>

  <g class="icon" transform="translate(100 219)" aria-hidden="true">
    <rect x="1" y="1" width="23" height="23" rx="4"/>
    <path d="M9 1v23m7-23v23M1 9h23M1 16h23"/>
  </g>
  <text class="heading" x="140" y="239">Token-canvas models</text>
  <text class="detail" x="100" y="273">Score canvas tokens</text>
  <text class="detail" x="100" y="298">Apply decode policy</text>

  <path class="icon" transform="translate(508 219)" d="M0 13h3c3 0 3-10 7-10s4 20 8 20 4-10 7-10h2" aria-hidden="true"/>
  <text class="heading" x="548" y="239">Continuous-latent models</text>
  <text class="detail" x="508" y="273">Refine latents</text>
  <text class="detail" x="508" y="298">Decode to tokens</text>

  <g transform="translate(100 401) scale(.5)" aria-hidden="true">
    <path fill="#FDB616" d="M1 19h17v34Z"/>
    <path fill="#30A3FF" d="M18 53l9-35 16-8-11.5 43Z"/>
    <path fill="#30A3FF" d="M46 10h3c13 0 21 8 21 19 0 14-11 24-27 24h-8.5l3-11H43c9 0 15-5 15-13 0-5-4-8-11-8h-4Z"/>
  </g>
  <text class="heading" x="149" y="424">Shared canvas sampler</text>
  <text class="detail" x="100" y="455">Report output token count per request</text>

  <path class="icon" transform="translate(100 561)" d="M3 11a10 10 0 1 1 1 8 M3 4v7h7" aria-hidden="true"/>
  <text class="heading" x="140" y="580">Block in progress</text>
  <text class="detail" x="100" y="612">Hold position</text>

  <g class="icon" transform="translate(508 561)" aria-hidden="true">
    <circle cx="13" cy="13" r="11"/>
    <path d="m7.5 13 3.5 3.5 7.5-8"/>
  </g>
  <text class="heading" x="548" y="580">Block complete</text>
  <text class="detail" x="508" y="612">Emit tokens to vLLM</text>
</svg>
