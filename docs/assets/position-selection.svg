<svg xmlns="http://www.w3.org/2000/svg" width="680" height="161" viewBox="0 0 680 161" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to rank masked positions</title>
  <desc id="desc">For greedy predictions, Mask 1 has a higher top probability while Mask 2 concentrates more probability on two candidates and has lower entropy.</desc>
  <style>
    :root { color-scheme: light dark; color: CanvasText; }
    text { fill: currentColor; font-family: Inter, system-ui, sans-serif; }
    .label { font-size: 18px; font-weight: 500; }
    .detail { font-size: 15px; }
    .line { fill: none; stroke: currentColor; stroke-opacity: .32; }
    .icon { fill: none; stroke: #1976bd; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) { .icon { stroke: #53b2ff; } }
  </style>
  <rect class="line" x=".5" y="6" width="679" height="149" rx="12"/>
  <path class="line" d="M340 6v155"/>
  <path class="icon" transform="translate(24 30)" d="M1 1h18v18H1z M10 1v18 M1 10h18"/>
  <text class="label" x="55" y="46" text-anchor="start">Mask 1</text>
  <rect x="24" y="65" width="172.8" height="14" fill="currentColor" opacity=".82"/>
  <rect x="196.8" y="65" width="57.6" height="14" fill="currentColor" opacity=".48"/>
  <rect x="254.4" y="65" width="57.6" height="14" fill="currentColor" opacity=".24"/>
  <text class="detail" x="24" y="104" text-anchor="start">60% / 20% / 20%</text>
  <text class="label" x="24" y="134" text-anchor="start">Highest confidence</text>
  <path class="icon" transform="translate(364 30)" d="M1 1h18v18H1z M10 1v18 M1 10h18"/>
  <text class="label" x="395" y="46" text-anchor="start">Mask 2</text>
  <rect x="364" y="65" width="158.4" height="14" fill="currentColor" opacity=".82"/>
  <rect x="522.4" y="65" width="126.72" height="14" fill="currentColor" opacity=".48"/>
  <rect x="649.12" y="65" width="2.88" height="14" fill="currentColor" opacity=".24"/>
  <text class="detail" x="364" y="104" text-anchor="start">55% / 44% / 1%</text>
  <text class="label" x="364" y="134" text-anchor="start">Lowest entropy</text>
</svg>
