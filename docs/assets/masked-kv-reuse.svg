<svg xmlns="http://www.w3.org/2000/svg" width="640" height="202" viewBox="0 0 640 202" role="img" aria-labelledby="title desc">
  <title id="title">Masked positions before the update</title>
  <desc id="desc">Positions 2 and 4 start masked. The next partial pass recomputes both, even though position 2 now holds B.</desc>
  <style>
    :root { color-scheme: light dark; color: CanvasText; }
    text { fill: currentColor; font-family: Inter, system-ui, sans-serif; }
    .label { font-size: 18px; font-weight: 500; }
    .detail { font-size: 15px; }
    .line { fill: none; stroke: currentColor; stroke-opacity: .32; }
    .icon { fill: none; stroke: #1976bd; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) { .icon { stroke: #53b2ff; } }
  </style>
  <rect class="line" x=".5" y="6" width="639" height="190" rx="12"/>
  <path class="icon" transform="translate(22 23)" d="M1 1h18v18H1z M10 1v18 M1 10h18"/>
  <text class="label" x="55" y="39">Masked positions before the update</text>
  <text class="detail" x="24" y="77">Before update</text>
  <rect class="line" x="170" y="55" width="106" height="32" rx="5"/>
  <text class="detail" x="223" y="76" text-anchor="middle">A</text>
  <rect class="line" x="280" y="55" width="106" height="32" rx="5" stroke-dasharray="4 3"/>
  <text class="detail" x="333" y="76" text-anchor="middle">mask</text>
  <rect class="line" x="390" y="55" width="106" height="32" rx="5"/>
  <text class="detail" x="443" y="76" text-anchor="middle">C</text>
  <rect class="line" x="500" y="55" width="106" height="32" rx="5" stroke-dasharray="4 3"/>
  <text class="detail" x="553" y="76" text-anchor="middle">mask</text>
  <text class="detail" x="24" y="123">After update</text>
  <rect class="line" x="170" y="101" width="106" height="32" rx="5"/>
  <text class="detail" x="223" y="122" text-anchor="middle">A</text>
  <rect class="line" x="280" y="101" width="106" height="32" rx="5"/>
  <text class="detail" x="333" y="122" text-anchor="middle">B</text>
  <rect class="line" x="390" y="101" width="106" height="32" rx="5"/>
  <text class="detail" x="443" y="122" text-anchor="middle">C</text>
  <rect class="line" x="500" y="101" width="106" height="32" rx="5" stroke-dasharray="4 3"/>
  <text class="detail" x="553" y="122" text-anchor="middle">mask</text>
  <text class="detail" x="24" y="169">Next partial pass</text>
  <rect class="line" x="170" y="147" width="106" height="32" rx="5"/>
  <text class="detail" x="223" y="168" text-anchor="middle">Reuse</text>
  <rect class="icon" x="280" y="147" width="106" height="32" rx="5"/>
  <text class="detail" x="333" y="168" text-anchor="middle">Recompute</text>
  <rect class="line" x="390" y="147" width="106" height="32" rx="5"/>
  <text class="detail" x="443" y="168" text-anchor="middle">Reuse</text>
  <rect class="icon" x="500" y="147" width="106" height="32" rx="5"/>
  <text class="detail" x="553" y="168" text-anchor="middle">Recompute</text>
</svg>
