<svg xmlns="http://www.w3.org/2000/svg" width="640" height="158" viewBox="0 0 640 158" role="img" aria-labelledby="title desc">
  <title id="title">Cache block alignment</title>
  <desc id="desc">One 64-token cache block spans two complete 32-token canvases.</desc>
  <style>
    :root { color-scheme: light dark; color: CanvasText; }
    text { fill: currentColor; font-family: Inter, system-ui, sans-serif; }
    .label { font-size: 18px; font-weight: 500; }
    .detail { font-size: 15px; }
    .line { fill: none; stroke: currentColor; stroke-opacity: .32; }
    .icon { fill: none; stroke: #1976bd; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) { .icon { stroke: #53b2ff; } }
  </style>
  <rect class="line" x=".5" y="6" width="639" height="146" rx="12"/>
  <path class="icon" transform="translate(22 23)" d="m0 6 10-5 10 5-10 5z M0 11l10 5 10-5 M0 16l10 5 10-5"/>
  <text class="label" x="55" y="39">Cache block alignment</text>
  <text class="detail" x="24" y="77">Decode canvases</text>
  <rect class="line" x="170" y="55" width="216" height="32" rx="5"/>
  <text class="detail" x="278" y="76" text-anchor="middle">32 tokens</text>
  <rect class="line" x="390" y="55" width="216" height="32" rx="5"/>
  <text class="detail" x="498" y="76" text-anchor="middle">32 tokens</text>
  <text class="detail" x="24" y="125">Cache block</text>
  <rect class="line" x="170" y="103" width="436" height="32" rx="5"/>
  <text class="detail" x="388" y="124" text-anchor="middle">64 tokens</text>
</svg>
