<svg xmlns="http://www.w3.org/2000/svg" width="640" height="158" viewBox="0 0 640 158" role="img" aria-labelledby="title desc">
  <title id="title">Shortest-first selection</title>
  <desc id="desc">With two active slots, probe scores of 0.2, 0.5 and 0.8 put B and C ahead of A.</desc>
  <style>
    :root { color-scheme: light dark; color: CanvasText; }
    text { fill: currentColor; font-family: Inter, system-ui, sans-serif; }
    .label { font-size: 18px; font-weight: 500; }
    .detail { font-size: 15px; }
    .line { fill: none; stroke: currentColor; stroke-opacity: .32; }
    .icon { fill: none; stroke: #1976bd; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) { .icon { stroke: #53b2ff; } }
  </style>
  <rect class="line" x=".5" y="6" width="639" height="146" rx="12"/>
  <path class="icon" transform="translate(22 23)" d="M1 3h18 M1 10h12 M1 17h6"/>
  <text class="label" x="55" y="39">Shortest-first selection</text>
  <text class="detail" x="24" y="77">Probe scores</text>
  <rect class="line" x="170" y="55" width="142" height="32" rx="5"/>
  <text class="detail" x="241" y="76" text-anchor="middle">A: 0.8</text>
  <rect class="line" x="316" y="55" width="142" height="32" rx="5"/>
  <text class="detail" x="387" y="76" text-anchor="middle">B: 0.2</text>
  <rect class="line" x="462" y="55" width="142" height="32" rx="5"/>
  <text class="detail" x="533" y="76" text-anchor="middle">C: 0.5</text>
  <text class="detail" x="24" y="125">Lowest first</text>
  <rect class="icon" x="170" y="103" width="142" height="32" rx="5"/>
  <text class="detail" x="241" y="124" text-anchor="middle">B: active</text>
  <rect class="icon" x="316" y="103" width="142" height="32" rx="5"/>
  <text class="detail" x="387" y="124" text-anchor="middle">C: active</text>
  <rect class="line" x="462" y="103" width="142" height="32" rx="5"/>
  <text class="detail" x="533" y="124" text-anchor="middle">A: waiting</text>
</svg>
