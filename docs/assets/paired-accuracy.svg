<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-labelledby="title desc">
  <title id="title">GSM8K evaluation sets</title>
  <desc id="desc">The plugin runs questions 1 through 100. Both implementations run questions 1 through 30 for the paired accuracy comparison.</desc>
  <style>
    :root { color-scheme: light dark; color: CanvasText; }
    text { fill: currentColor; font-family: Inter, system-ui, sans-serif; }
    .label { font-size: 18px; font-weight: 500; }
    .detail { font-size: 15px; }
    .line { fill: none; stroke: currentColor; stroke-opacity: .32; }
    .icon { fill: none; stroke: #1976bd; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) { .icon { stroke: #53b2ff; } }
  </style>
  <rect class="line" x=".5" y="6" width="639" height="148" rx="12"/>
  <path class="icon" transform="translate(22 23)" d="M1 1h18v18H1z M10 1v18 M1 10h18"/>
  <text class="label" x="55" y="39">GSM8K evaluation sets</text>
  <text class="detail" x="24" y="80">Plugin</text>
  <rect class="line" x="152" y="58" width="460" height="32" rx="5"/>
  <text class="detail" x="382" y="79" text-anchor="middle">Questions 1–100</text>
  <text class="detail" x="24" y="128">Reference</text>
  <rect class="icon" x="152" y="106" width="138" height="32" rx="5"/>
  <text class="detail" x="221" y="127" text-anchor="middle">1–30</text>
  <text class="detail" x="309" y="127">Same first 30 questions</text>
</svg>
