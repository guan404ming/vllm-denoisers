[project]
site_name = "vllm-denoisers"
site_url = "https://guan404ming.github.io/vllm-denoisers/"
repo_url = "https://github.com/guan404ming/vllm-denoisers"
repo_name = "guan404ming/vllm-denoisers"
extra_css = ["stylesheets/models.css"]
nav = [
    { "Home" = [
        { "Overview" = "index.md" },
        { "Getting Started" = ["installation.md", "quickstart.md"] },
    ] },
    { "Recipes" = [
        { "Overview" = "models.md" },
        { "Token-canvas models" = [
            "models/diffusion-gemma.md",
            "models/dllm-bd3lm.md",
            "models/dream.md",
            "models/fast-dllm-v2.md",
            "models/llada.md",
            "models/llada2.md",
            "models/llada-moe.md",
            "models/nemotron-labs-diffusion.md",
            "models/sdar-trado.md",
            "models/sdllm.md",
            "models/stable-diffcoder.md",
            "models/trado.md",
        ] },
        { "Continuous-latent models" = ["models/nemotron-labs-sigma.md"] },
    ] },
    { "User guide" = [
        { "Overview" = "user-guide.md" },
        { "Concepts" = ["concepts/block-decoding.md", "concepts/denoising-step.md"] },
        { "Features" = [
            "features/decode-policies.md",
            "features/kv-cache-reuse.md",
            "features/prediction-feedback.md",
            "features/request-scheduling.md",
            "features/output-head-quantization.md",
        ] },
        { "Configuration" = ["configuration/batch-limits.md", "configuration/settings.md"] },
    ] },
    { "Developer guide" = [
        { "Overview" = "contributor-guide.md" },
        { "Development" = ["architecture.md", "extending.md"] },
        { "Validation" = ["testing.md", "benchmarking.md"] },
    ] },
]
[project.theme]
custom_dir = "docs/.overrides"
logo = "assets/denoisers.svg"
favicon = "assets/denoisers.svg"
features = ["navigation.tabs", "navigation.sections", "navigation.path", "navigation.footer", "content.code.copy"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
